<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости сайта</title>
    <style>
        .header {
            background: white;
            padding: 48px 56px 32px 56px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
        }

        .form-content {
            padding: 40px 56px 56px 56px;
            max-width: 700px;
            margin: 0 auto;
        }

        .field {
            margin-bottom: 40px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 20px;
            font-weight: 800;
            color: #2c3e50;
            font-size: 18px;
            text-align: left;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #dee2e6;
            border-radius: 14px;
            font-size: 16px;
            background: white;
            font-family: inherit;
            text-align: left;
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
            align-items: stretch;
        }

        .features label {
            width: 100%;
            justify-content: flex-start;
            text-align: left;
            display: flex;
            align-items: center;
            padding: 12px 18px;
            font-weight: 500;
            font-size: 15px;
        }

        .features input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }

        .urgency {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .urgency label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: #f8f9fa;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 0;
            color: #2c3e50;
            width: 100%;
            font-weight: 500;
        }

        .urgency input[type="radio"] {
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #357abd;
        }

        .result {
            margin-top: 48px;
            padding: 40px 48px;
            background: #e6f3ff;
            border-radius: 20px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .total-label {
            font-size: 18px;
            font-weight: 600;
            color: #4a90e2;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .price {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
            color: #1a1a1a;
        }

        .deadline {
            font-size: 26px;
            font-weight: 600;
            margin: 20px 0 24px 0;
            text-align: center;
            color: #333333;
        }

        .divider {
            margin: 28px 0;
            border: none;
            height: 1px;
            background: rgba(0, 0, 0, 0.1);
        }

        .explanation {
            background: #ffffff;
            padding: 28px 32px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.9;
            color: #1a1a1a;
        }

        .explanation strong {
            color: #4a90e2;
            font-weight: 700;
        }

        /* Стиль для скрытого поля */
        .hidden-field {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="calculator">
        <div class="header">
            <h2> Калькулятор стоимости сайта</h2>
            <p>Рассчитайте примерную стоимость и сроки разработки</p>
        </div>

        <form method="POST" action="/">
            <div class="form-content">
                <div class="field">
                    <label>🌐 Тип сайта</label>
                    <select name="type" id="type" required>
                        <option value="landing" {% if form_data and form_data.type == 'landing' %}selected{% endif %}>Лендинг (одностраничный)</option>
                        <option value="corporate" {% if form_data and form_data.type == 'corporate' %}selected{% endif %}>Корпоративный сайт</option>
                        <option value="shop" {% if form_data and form_data.type == 'shop' %}selected{% endif %}>Интернет-магазин</option>
                    </select>
                </div>

                <!-- Поле "Количество страниц" с id для управления видимостью -->
                <div class="field" id="pagesField">
                    <label>📄 Количество страниц</label>
                    <input type="number" name="pages" id="pages" value="{{ form_data.pages if form_data else '1' }}" min="1" max="100">
                    <div class="error" id="pagesError" style="display:none; color: #dc3545; font-size: 13px; margin-top: 8px;"></div>
                </div>

                <div class="field">
                    <label>⚙️ Дополнительные функции</label>
                    <div class="features">
                        <label><input type="checkbox" name="features" value="form" {% if form_data and 'form' in form_data.features %}checked{% endif %}> 📝 Форма заявки</label>
                        <label><input type="checkbox" name="features" value="catalog" {% if form_data and 'catalog' in form_data.features %}checked{% endif %}> 📚 Каталог</label>
                        <label><input type="checkbox" name="features" value="payment" {% if form_data and 'payment' in form_data.features %}checked{% endif %}> 💳 Онлайн-оплата</label>
                        <label><input type="checkbox" name="features" value="crm" {% if form_data and 'crm' in form_data.features %}checked{% endif %}> 🔄 Интеграция с CRM</label>
                        <label><input type="checkbox" name="features" value="multilang" {% if form_data and 'multilang' in form_data.features %}checked{% endif %}> 🌍 Мультиязычность</label>
                    </div>
                </div>

                <div class="field">
                    <label>⏱️ Срочность</label>
                    <div class="urgency">
                        <label><input type="radio" name="urgency" value="normal" {% if not form_data or form_data.urgency == 'normal' %}checked{% endif %}> 🐢 Обычная</label>
                        <label><input type="radio" name="urgency" value="urgent" {% if form_data and form_data.urgency == 'urgent' %}checked{% endif %}> ⚡ Срочно (+30%)</label>
                        <label><input type="radio" name="urgency" value="very" {% if form_data and form_data.urgency == 'very' %}checked{% endif %}> 🚀 Очень срочно (+60%)</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">📊 РАССЧИТАТЬ</button>

                {% if result %}
                <div class="result">
                    <div class="total-label">📊 ИТОГО</div>
                    <div class="price">{{ result.price }} ₽</div>
                    <div class="deadline">⏱️ Срок: {{ result.deadline }} дней</div>
                    <hr class="divider">
                    <div class="explanation">{{ result.explanation | safe }}</div>
                </div>
                {% endif %}
            </div>
        </form>
    </div>
</div>

<script>
    // Функция для показа/скрытия поля "Количество страниц"
    function togglePagesField() {
        const typeSelect = document.getElementById('type');
        const pagesField = document.getElementById('pagesField');

        if (!typeSelect || !pagesField) return;

        const selectedType = typeSelect.value;

        if (selectedType === 'landing') {
            // Если выбран лендинг - скрываем поле
            pagesField.classList.add('hidden-field');
            // Сбрасываем значение количества страниц до 1
            const pagesInput = document.getElementById('pages');
            if (pagesInput) pagesInput.value = 1;
        } else {
            // Если выбран не лендинг - показываем поле
            pagesField.classList.remove('hidden-field');
        }
    }

    // Валидация количества страниц на клиенте
    function validatePages() {
        const typeSelect = document.getElementById('type');
        const pagesInput = document.getElementById('pages');
        const pagesError = document.getElementById('pagesError');

        if (!pagesInput || !pagesError) return;

        // Если лендинг - не валидируем
        if (typeSelect && typeSelect.value === 'landing') {
            pagesError.style.display = 'none';
            return true;
        }

        let pages = parseInt(pagesInput.value, 10);
        const minPages = 1;
        const maxPages = 100;

        if (isNaN(pages) || pages < minPages) {
            pagesInput.value = minPages;
            pagesError.textContent = 'Минимум 1 страница';
            pagesError.style.display = 'block';
            return false;
        } else if (pages > maxPages) {
            pagesInput.value = maxPages;
            pagesError.textContent = 'Максимум 100 страниц';
            pagesError.style.display = 'block';
            return false;
        } else {
            pagesError.style.display = 'none';
            return true;
        }
    }

    // Навешиваем обработчики после загрузки страницы
    document.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.getElementById('type');
        const pagesInput = document.getElementById('pages');

        if (typeSelect) {
            typeSelect.addEventListener('change', function() {
                togglePagesField();
                validatePages();
            });
        }

        if (pagesInput) {
            pagesInput.addEventListener('input', validatePages);
        }

        // Вызываем при загрузке для начальной настройки
        togglePagesField();
        validatePages();
    });
</script>
</body>
</html>
